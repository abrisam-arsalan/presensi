server {
    listen 80;
    listen [::]:80;
    server_name presensi.smp5tegal.sch.id;

    # Akses log (opsional)
    access_log /var/log/nginx/presensi.access.log;
    error_log /var/log/nginx/presensi.error.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Header penting agar aplikasi bisa membaca IP asli pengunjung
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (jika diperlukan di masa depan)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
